name: Build ToonMitra Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip ToonMitra_Android_Starter.zip -d project

      - name: Fix Java Kotlin compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for p in Path("project").rglob("*.gradle.kts"):
              s = p.read_text()

              s = s.replace(
                  "JavaVersion.VERSION_1_8",
                  "JavaVersion.VERSION_17"
              )
              s = s.replace(
                  'jvmTarget = "1.8"',
                  'jvmTarget = "17"'
              )
              s = s.replace(
                  "JvmTarget.JVM_1_8",
                  "JvmTarget.JVM_17"
              )

              p.write_text(s)
              print("Checked:", p)
          PY

      - name: Build APK
        run: |
          cd project
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ToonMitra-Android-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
